[project]
name = "machine-monitoring-backend"
version = "1.0.0"
description = "Factory machine monitoring API — KEPServer → Azure SQL → FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aioodbc>=0.5.0",
    "pyodbc>=5.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis[hiredis]>=5.1.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.18.0",
    "opencensus-ext-azure>=1.1.13",
    "opencensus-ext-logging>=0.1.1",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "orjson>=3.10.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ARG", "PTH", "RUF"]
ignore = ["S101", "ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"
